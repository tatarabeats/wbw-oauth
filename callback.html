<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>WannaBeWise Publisher</title>
<style>body{font-family:system-ui;background:#0d0f14;color:#e8e4d9;display:grid;place-items:center;height:100vh;margin:0}
.b{text-align:center}code{background:#1a1d24;padding:.4rem .7rem;border-radius:6px;display:inline-block;margin-top:1rem;word-break:break-all}</style>
</head><body><div class="b">
<h1>WannaBeWise Publisher</h1>
<p id="m">認可コードを受け取りました。</p>
<code id="c"></code>
<script>
const p=new URLSearchParams(location.search);
const code=p.get('code'), err=p.get('error');
document.getElementById('c').textContent = code ? code : (err||'（コードなし）');
document.getElementById('m').textContent = code ? 'このコードをClaudeに貼ってください:' : (err? 'エラー: ':'このページは認可の受け口です。');
</script>
</div></body></html>
